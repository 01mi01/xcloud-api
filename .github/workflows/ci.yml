name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - apps/services/auth-service
          - apps/services/user-service
          - apps/services/tweet-service
          - apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
        working-directory: ${{ matrix.service }}
      - run: npm test
        working-directory: ${{ matrix.service }}
