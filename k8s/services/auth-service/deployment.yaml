apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: xcloud
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      serviceAccountName: xcloud-sa
      containers:
        - name: auth-service
          image: auth-service:latest
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: auth-service-secrets
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
